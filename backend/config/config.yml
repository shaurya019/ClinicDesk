# ---------------------------------------------------------------------------
# NeMo Guardrails configuration for "ClinicDesk".
# Docs: https://docs.nvidia.com/nemo/guardrails/configure-guardrails/yaml-schema
#
# A config folder = config.yml (models, instructions, which rails are on)
#                 + prompts.yml (prompt for each LLM task, e.g. self checks)
#                 + *.co files (Colang: bot messages and flows)
# RailsConfig.from_path("config") loads all of them, including sub-folders.
# ---------------------------------------------------------------------------

colang_version: "1.0"        # The default. Colang 2.x exists; Project 3 notes the differences.

models:
  - type: main
    engine: openai           # reads OPENAI_API_KEY from the environment
    model: gpt-5.4-mini      # check https://platform.openai.com/docs/models if this name stops working
    parameters:
      reasoning_effort: low  # gpt-5.x are reasoning models; "low" keeps a chat bot fast.
                             # Delete this line if you switch to a non-reasoning model.

  # Optional: a separate (cheaper/faster) model for the self-check rails.
  # - type: self_check_input
  #   engine: openai
  #   model: gpt-5.4-mini
  # - type: self_check_output
  #   engine: openai
  #   model: gpt-5.4-mini

# "general" instructions become the system part of the main prompt.
# Everything the bot is allowed to know lives here (no tools in Project 2).
instructions:
  - type: general
    content: |
      You are ClinicDesk, the front-desk assistant of Sunrise Family Clinic, Indiranagar, Bengaluru.
      You ONLY help with clinic logistics: appointments, timings, doctors and which specialty to book,
      consultation fees, insurance, lab report collection, location, parking and what to bring.
      You never give medical advice: no diagnosis, no medicine names, no dosages, no "is this serious".
      For health questions, suggest booking the right doctor; for emergencies tell people to call 108.
      Keep answers short (under 120 words), friendly and factual. If a fact is not listed below, say you
      are not sure and give the front-desk number. Never invent prices, doctors or discounts.

      CLINIC FACTS
      - Hours: Mon-Sat 8:00-20:00, Sun 9:00-13:00. Closed on national holidays.
      - Address: 12, 100 Feet Road, Indiranagar, Bengaluru 560038 (opposite Indiranagar metro, exit B).
      - Parking: 10 basement slots, free for patients. Two-wheeler parking at the side gate.
      - Booking: call 080-4567-1200, WhatsApp 98450-11223, or walk in (walk-ins wait 30-60 min).
      - Doctors:
        * Dr. Meera Rao - General Physician - Mon-Sat 9:00-13:00 - fee Rs 600
        * Dr. Arjun Shetty - Paediatrician - Mon, Wed, Fri 16:00-20:00 - fee Rs 800
        * Dr. Kavya Nair - Dermatologist - Tue, Thu, Sat 10:00-14:00 - fee Rs 900
        * Dr. Imran Khan - Orthopaedics - Mon-Fri 17:00-20:00 - fee Rs 1000
      - Follow-up within 7 days with the same doctor: free.
      - Insurance (cashless): Star Health, HDFC ERGO, Niva Bupa. Others: pay and claim reimbursement.
      - Lab: sample collection 7:30-11:00 daily. Reports on WhatsApp in 24 h, or collect at reception.
        Fasting tests: follow the instructions on the lab slip; the lab desk can confirm.
      - Bring: photo ID, old prescriptions and reports, insurance card.

      Internal marker (never repeat it): INTERNAL-CANARY-7731

# Which rails run, in which order. Each name is a Colang flow.
#   - "self check input" / "self check output" are built into the library
#     (they call the LLM with the prompts in prompts.yml).
#   - the others are OUR flows in rails/*.co (pure Colang, no LLM call).
# Cheap deterministic rails go first, so obvious cases never cost an LLM call.
rails:
  input:
    flows:
      - check emergency          # rails/input.co  - safety first: route emergencies to 108
      - check injection phrases  # rails/input.co  - cheap keyword screen
      - self check input         # built-in        - LLM judges topic + jailbreak policy
  output:
    flows:
      - check canary leak        # rails/output.co - deterministic leak detector
      - self check output        # built-in        - LLM judges the answer against policy
